<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1822">
  <title>Monarchien in der Welt</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a1822;
      color: #f7fbfd;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 22px 24px 16px;
    }

    header {
      text-align: center;
      margin: 0 0 6px;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 58px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    p {
      margin: 8px 0 0;
      color: #c9d8df;
      font-size: clamp(16px, 1.7vw, 24px);
    }

    .globe-stage {
      position: relative;
      display: grid;
      place-items: center;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    canvas {
      display: block;
      max-width: 94vw;
      max-height: calc(100vh - 125px);
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.36));
    }

    .status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      font-size: clamp(18px, 2vw, 26px);
      color: #eaf3f7;
      pointer-events: none;
    }

    .status.hidden { display: none; }

    @media (max-width: 640px) {
      main { padding: 16px 10px 10px; }
      h1 { font-size: 30px; }
      p { font-size: 16px; }
      canvas { max-height: calc(100vh - 105px); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Monarchien in der Welt</h1>
      <p>Welche Länder sind rot und orange hervorgehoben?</p>
    </header>

    <section class="globe-stage" aria-label="Rotierende Weltkugel mit Monarchien">
      <canvas id="globe" role="img" aria-label="Rotierende Weltkugel mit dunkelrot markierten absoluten Monarchien und orange markierten parlamentarischen Monarchien"></canvas>
      <div id="status" class="status">Weltkarte wird geladen …</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('globe');
      const status = document.getElementById('status');
      const ctx = canvas.getContext('2d');

      // Absolute Monarchien: Saudi-Arabien, Oman, Brunei
      const absoluteIds = new Set([682, 512, 96]);
      // Parlamentarische Monarchien: Großbritannien, Schweden, Spanien, Lesotho, Thailand, Japan
      const parliamentaryIds = new Set([826, 752, 724, 426, 764, 392]);

      const DATA_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';
      // Etwas schneller als die letzte Demokratie-Version: ca. 48 Sekunden pro Umdrehung.
      const ROTATION_SPEED = 0.0075; // Grad pro Millisekunde

      let countries = [];
      let borders = null;
      let size = 700;
      let longitude = -5;
      let previousTime = performance.now();
      let running = false;

      const projection = d3.geoOrthographic()
        .precision(0.3)
        .clipAngle(90)
        .rotate([longitude, -10, 0]);

      const path = d3.geoPath(projection, ctx);

      function resize() {
        const availableW = Math.max(320, window.innerWidth * 0.94);
        const availableH = Math.max(320, window.innerHeight - 115);
        size = Math.floor(Math.min(900, availableW, availableH));

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        canvas.width = Math.floor(size * dpr);
        canvas.height = Math.floor(size * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        projection
          .translate([size / 2, size / 2])
          .scale(size * 0.47);

        if (countries.length) draw();
      }

      function drawGeometry(geometry, fill, stroke, lineWidth) {
        ctx.beginPath();
        path(geometry);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }
      }

      // Kleine Inseln und Überseegebiete werden bewusst reduziert,
      // damit keine zusätzlichen Farb-Flecken entstehen und die Länder
      // auf dem Beamer klar erkennbar bleiben.
      function highlightGeometry(country) {
        const id = Number(country.id);
        const isAbsolute = absoluteIds.has(id);
        const isParliamentary = parliamentaryIds.has(id);
        if (!isAbsolute && !isParliamentary) return null;

        if (country.geometry.type === 'Polygon') return country;
        if (country.geometry.type !== 'MultiPolygon') return country;

        let polygons = country.geometry.coordinates.map(coords => ({
          type: 'Feature',
          properties: country.properties || {},
          geometry: { type: 'Polygon', coordinates: coords }
        }));

        // Nach Flächengröße sortieren und nur die prägenden Landmassen behalten.
        polygons.sort((a, b) => d3.geoArea(b) - d3.geoArea(a));

        const keepCount = {
          826: 2, // Großbritannien: Great Britain + Northern Ireland
          392: 4, // Japan: vier Hauptinseln
          96: 2,  // Brunei: zwei Hauptteile
          724: 1, // Spanien: vor allem Festland
          752: 1, // Schweden
          426: 1, // Lesotho
          764: 1, // Thailand
          682: 1, // Saudi-Arabien
          512: 1  // Oman
        }[id] || 1;

        return { type: 'FeatureCollection', features: polygons.slice(0, keepCount) };
      }

      function fillForCountry(country) {
        const id = Number(country.id);
        if (absoluteIds.has(id)) {
          return { fill: '#8b1e2d', stroke: '#5f0f1a' }; // dunkles Rot
        }
        if (parliamentaryIds.has(id)) {
          return { fill: '#f28c28', stroke: '#b85f09' }; // Orange
        }
        return null;
      }

      function draw() {
        ctx.clearRect(0, 0, size, size);

        // Heller Ozean und klarer Kugelrand.
        drawGeometry({ type: 'Sphere' }, '#d9edf7', '#8ba6b3', 1.8);

        // Zuerst alle Länder neutral zeichnen.
        for (const country of countries) {
          drawGeometry(country, '#f8f7f1', null, 0);
        }

        // Dann die gewünschten Monarchien einfärben.
        for (const country of countries) {
          const highlighted = highlightGeometry(country);
          const color = fillForCountry(country);
          if (highlighted && color) {
            drawGeometry(highlighted, color.fill, color.stroke, 1.4);
          }
        }

        // Ländergrenzen deutlich über die Flächen legen.
        if (borders) {
          ctx.beginPath();
          path(borders);
          ctx.strokeStyle = '#52656e';
          ctx.lineWidth = Math.max(0.65, size / 900);
          ctx.stroke();
        }

        // Kugelrand noch einmal sauber nachziehen.
        drawGeometry({ type: 'Sphere' }, null, '#75909c', 1.8);
      }

      function animate(now) {
        if (!running) return;
        const dt = Math.min(50, now - previousTime);
        previousTime = now;
        longitude = (longitude + dt * ROTATION_SPEED) % 360;
        projection.rotate([longitude, -10, 0]);
        draw();
        requestAnimationFrame(animate);
      }

      async function start() {
        resize();
        try {
          if (!window.d3 || !window.topojson) {
            throw new Error('Kartenbibliothek konnte nicht geladen werden.');
          }

          const response = await fetch(DATA_URL, { cache: 'force-cache' });
          if (!response.ok) throw new Error('Kartendaten konnten nicht geladen werden.');
          const world = await response.json();

          countries = topojson.feature(world, world.objects.countries).features;
          borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

          status.classList.add('hidden');
          draw();
          running = true;
          previousTime = performance.now();
          requestAnimationFrame(animate);
        } catch (error) {
          console.error(error);
          status.textContent = 'Die Weltkarte konnte nicht geladen werden. Bitte die Internetverbindung prüfen und die Seite neu laden.';
        }
      }

      window.addEventListener('resize', resize, { passive: true });
      start();
    })();
  </script>
</body>
</html>
